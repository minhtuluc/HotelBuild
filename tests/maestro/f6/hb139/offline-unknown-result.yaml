appId: vn.pinehill.operations
---
# HB-139 AC7 — offline_is_not_success. Tắt mạng trước khi xác nhận: không gửi lệnh, không báo giao phòng thành công;
# bật lại mạng thì tra kết quả/gửi lại đúng lệnh. Biến môi trường như move-step1-2.yaml (không commit giá trị).
# Chưa chạy được: thiếu runner/thiết bị — BLOCKED trong PR.
- launchApp:
    clearState: true
- tapOn:
    id: "username"
- inputText: "${F6_TEST_USERNAME}"
- tapOn:
    id: "password"
- inputText: "${F6_TEST_PASSWORD}"
- tapOn:
    id: "login-submit"
- openLink: "pinehill-operations://alerts"
- tapOn:
    id: "open-${F6_CASE_ID}-${F6_BOOKING_STEP1_ID}"
- tapOn:
    id: "pick-0"
- tapOn:
    id: "reason-input"
- inputText: "Quá tải, đổi phòng cùng loại"
- hideKeyboard
- tapOn:
    id: "consent-check"
- setAirplaneMode: enabled
- tapOn:
    id: "create-move"
- assertVisible: "Cần kết nối mạng để thực hiện; lệnh chưa được gửi."
- assertNotVisible: "Đã thực hiện (EXECUTED)."
- assertNotVisible: "Máy chủ đã xác nhận lệnh."
- setAirplaneMode: disabled
- tapOn:
    id: "create-move"
- assertVisible:
    id: "move-final"
- assertNotVisible: "Đã thực hiện (EXECUTED)."
