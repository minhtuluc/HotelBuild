name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  # HB-183: bộ quét bảo mật chạy hằng đêm; gitleaks là phần quét bí mật của bộ đó.
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full HEAD history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install checksum-pinned Gitleaks 8.30.1
        run: |
          bash infra/security/install-gitleaks.sh "$RUNNER_TEMP/hb176-bin"
          echo "$RUNNER_TEMP/hb176-bin" >> "$GITHUB_PATH"
      - name: Regression tests with the real scanner and owned Git fixtures
        run: node --test infra/security/scan-git-secrets.test.mjs
      - name: Scan full commit history with protected exceptions and redacted output
        run: bash infra/security/scan-git-secrets.sh
